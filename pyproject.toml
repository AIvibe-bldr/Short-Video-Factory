[project]
name = "short-video-factory"
version = "0.1.0"
description = "トレンドショート動画の要点を抽出し、商品紹介ショート動画を量産するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=6.1.0",
    "youtube-transcript-api>=0.6.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
svf = "svf.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
