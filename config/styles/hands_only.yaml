# スタイル: 人物は出さず、手元と生活シーンでさりげなく紹介
display_name: 手元と生活シーンでさりげなく紹介
description: >
  顔出しなし。手元のアップと生活の中で商品を使う様子だけで構成する。
  ASMR的な心地よさと「ていねいな暮らし」の空気感で見せるスタイル。
language: ja
presenter: ""
tone: >
  ナレーションは控えめで落ち着いたトーン。説明しすぎず、
  短いつぶやきのような言葉を置く。無音・環境音のシーンがあってもよい。
visual_style: >
  自然光のやわらかい映像。木目のテーブル、白い布、観葉植物などの
  生活感のある背景。手元のクローズアップ中心。色味は暖色系で統一。
product_placement: subtle
camera_direction: >
  俯瞰(真上)と斜め45度の手元アップを使い分ける。
  商品を「使う動作」を丁寧に見せる。開ける・注ぐ・塗るなどの動作音を活かす。
  ロゴのアップは1〜2回まで、あくまで生活の一部として映す。
duration_seconds: 30
tts_voice: ja-JP-NanamiNeural
extra_instructions: >
  宣伝と感じさせないこと。「商品の説明」ではなく「商品のある時間」を描く。
  テロップは最小限で、詩的な短い言葉にする。
