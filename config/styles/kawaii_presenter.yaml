# スタイル: 可愛い女の子が商品を紹介する
display_name: 可愛い女の子が商品を紹介
description: >
  明るく親しみやすい若い女性が、友達に教えるようなテンションで
  商品を正面から紹介するスタイル。
language: ja
presenter: >
  20代前半の可愛らしい日本人女性。明るくナチュラルなメイク、
  カジュアルで清潔感のある服装。表情豊かでカメラ目線。
tone: >
  友達に「ねえ聞いて!」と話すような親近感のあるテンション。
  語尾は柔らかく、テンポは速め。共感ワード(「わかる〜」「これ本当にすごい」)を使う。
visual_style: >
  明るい自然光の室内。ピンク・白基調の可愛い部屋。
  顔のアップと商品を持った手元のカットを交互に。テロップは丸ゴシック系で大きく。
product_placement: featured
camera_direction: >
  スマホ自撮り風の目線の高さ。冒頭は顔アップで話しかけ、
  商品紹介パートでは商品をカメラに近づける。使用シーンのインサートを挟む。
duration_seconds: 30
tts_voice: ja-JP-NanamiNeural
extra_instructions: >
  冒頭は必ず視聴者への問いかけか驚きの一言で始める。
  最後は「試してみてね」系の柔らかいCTAで締める。
